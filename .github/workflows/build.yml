name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:assembleDebug
      # APKs are release assets, not long-lived Actions artifacts.
      # Keep this temporary artifact only briefly for build verification.
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 1

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:packageDeb
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-deb
          path: composeApp/build/compose/binaries/main/deb/*.deb
          retention-days: 1

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:packageMsi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-msi
          path: composeApp/build/compose/binaries/main/msi/*.msi
          retention-days: 1

  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:packageDmg
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dmg
          path: composeApp/build/compose/binaries/main/dmg/*.dmg
          retention-days: 1

  web-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:wasmJsBrowserDistribution
      - uses: actions/upload-artifact@v4
        with:
          name: web-wasm
          path: composeApp/build/dist/wasmJs/productionExecutable/
          retention-days: 1

  web-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:jsBrowserDistribution
      - uses: actions/upload-artifact@v4
        with:
          name: web-js
          path: composeApp/build/dist/js/productionExecutable/
          retention-days: 1
